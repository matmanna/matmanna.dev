name = "matmanna-location"
main = "index.js"
compatibility_date = "2025-01-01"

routes = [
  { pattern = "location.matmanna.dev", custom_domain = true }
]

# Map styles ("owner/style-id"): the site's stone palette, uploaded to Mapbox Studio
# (source: location/style/cartoon-stone-*.json). Remove to fall back to Mapbox's own styles.
[vars]
STYLE_LIGHT = "matmanna/cmvyoa5di00e401s7f5zq89mf"
STYLE_DARK = "matmanna/cmvyo8vr300e101qpds8sbl9d"

# Create with: wrangler kv namespace create LOCATION
[[kv_namespaces]]
binding = "LOCATION"
id = "3f828ecf8a174c9aa7728fd88f1967d9"

# Secrets: wrangler secret put MAPBOX_TOKEN / UPDATE_TOKEN / WHOLE_REGIONS (optional, JSON: {"Region name":[west,south,east,north]})
